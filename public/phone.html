<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>iPhone トラッカー</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font: 15px/1.5 -apple-system, system-ui, sans-serif; background: #111; color: #eee;
      padding: max(16px, env(safe-area-inset-top)) 16px 16px; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    video { width: 100%; max-height: 45vh; object-fit: cover; border-radius: 12px; background: #000; transform: scaleX(-1); }
    button { font: inherit; padding: 12px 16px; border-radius: 10px; border: 0; background: #4f7cff; color: #fff; width: 100%; margin-top: 10px; }
    button.sub { background: #333; }
    .row { display: flex; gap: 8px; }
    .row button { flex: 1; }
    #status { margin-top: 10px; padding: 10px; border-radius: 10px; background: #222; white-space: pre-line; font-variant-numeric: tabular-nums; }
    .hint { color: #999; font-size: 13px; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>📱 iPhone フェイストラッカー</h1>
  <video id="video" playsinline muted></video>
  <button id="start">トラッキング開始</button>
  <div class="row">
    <button id="calib" class="sub">正面をリセット</button>
    <button id="preview" class="sub">映像を隠す</button>
  </div>
  <div id="status">待機中</div>
  <p class="hint">iPhone を顔の正面・少し下に固定してください。画面は自動でスリープしないようにしますが、Safari を閉じたり別アプリに切り替えると止まります。</p>
  <script type="module" src="/phone.js"></script>
</body>
</html>
