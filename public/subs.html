<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>登録者数</title>
  <!--
    OBS のブラウザソース用 (背景は透過)。URL パラメータ:
      label=登録者     ラベルの文字 (空にすると非表示)
      goal=1000       目標人数 (指定するとゲージを表示)
      size=56         数字の大きさ (px)
      color=ffffff    文字色
      interval=20     更新間隔 (秒、最小 15)
  -->
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; }
    body {
      font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Meiryo", sans-serif;
      color: var(--color);
      padding: 16px;
      -webkit-text-stroke: calc(var(--size) * 0.1) #1b2440;
      paint-order: stroke fill;
    }
    .box { display: inline-flex; flex-direction: column; gap: 6px; }
    .row { display: flex; align-items: baseline; gap: 12px; position: relative; }
    #label { font-size: calc(var(--size) * 0.5); font-weight: 800; }
    #count { font-size: var(--size); font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
    #count.bump { animation: bump .6s ease-out; }
    @keyframes bump { 30% { transform: scale(1.18); color: #ffe066; } }
    .plus {
      position: absolute; right: -8px; top: 0; font-size: calc(var(--size) * 0.5); font-weight: 900; color: #ffe066;
      animation: rise 1.6s ease-out forwards;
    }
    @keyframes rise { from { opacity: 1; transform: translate(100%, 0); } to { opacity: 0; transform: translate(100%, -120%); } }
    #gauge { display: none; height: calc(var(--size) * 0.22); min-width: calc(var(--size) * 5); border-radius: 99px; background: #1b2440aa; border: 2px solid #1b2440; overflow: hidden; }
    #gauge div { height: 100%; width: 0; background: linear-gradient(90deg, #8fd3ff, #c9a8ff); transition: width 1s ease-out; }
    #goalText { display: none; font-size: calc(var(--size) * 0.32); font-weight: 800; }
    #error { font-size: 14px; color: #ffb3b3; -webkit-text-stroke: 0; background: #000a; padding: 4px 8px; border-radius: 6px; }
    #error:empty { display: none; }
  </style>
</head>
<body>
  <div class="box">
    <div class="row"><span id="label"></span><span id="count">-</span></div>
    <div id="gauge"><div></div></div>
    <span id="goalText"></span>
    <span id="error"></span>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    const goal = Number(q.get('goal')) || 0;
    const interval = Math.max(15, Number(q.get('interval')) || 20) * 1000;
    document.body.style.setProperty('--size', `${Number(q.get('size')) || 56}px`);
    document.body.style.setProperty('--color', `#${q.get('color') || 'ffffff'}`);
    const $ = (id) => document.getElementById(id);
    $('label').textContent = q.get('label') ?? '登録者';
    if (goal) $('gauge').style.display = $('goalText').style.display = 'block';

    let shown = null;
    const fmt = (n) => n.toLocaleString('ja-JP');

    // 数字をカウントアップさせながら表示
    function animateTo(target) {
      const from = shown ?? target;
      const t0 = performance.now();
      const step = (t) => {
        const k = Math.min(1, (t - t0) / 1200);
        $('count').textContent = fmt(Math.round(from + (target - from) * (1 - (1 - k) ** 3)));
        if (k < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
      if (shown != null && target > shown) {
        $('count').classList.remove('bump');
        void $('count').offsetWidth;
        $('count').classList.add('bump');
        const plus = Object.assign(document.createElement('span'), { className: 'plus', textContent: `+${target - shown}` });
        $('count').parentNode.append(plus);
        setTimeout(() => plus.remove(), 1700);
      }
      shown = target;
      if (goal) {
        $('gauge').firstElementChild.style.width = `${Math.min(100, (target / goal) * 100)}%`;
        $('goalText').textContent = target >= goal ? `🎉 目標 ${fmt(goal)} 人達成！` : `目標 ${fmt(goal)} 人まであと ${fmt(goal - target)} 人`;
      }
    }

    async function update() {
      try {
        const r = await fetch('/api/subscribers');
        const d = await r.json();
        if (d.error) throw new Error(d.error);
        $('error').textContent = '';
        if (d.hidden) $('count').textContent = '非公開';
        else animateTo(d.count);
      } catch (e) {
        $('error').textContent = `登録者数: ${e.message}`;
      }
    }
    update();
    setInterval(update, interval);
  </script>
</body>
</html>
