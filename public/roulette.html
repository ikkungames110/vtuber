<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>話題ルーレット</title>
  <!--
    OBS のブラウザソース用 (背景は透過、幅 760 / 高さ 620 推奨。scale を変えたらその倍率ぶん)。
    スロットマシンの回転ドラム式。登録者が 1 人増えるごとに 1 回まわる
    (複数人増えたらその回数ぶん順番に回る)。
    URL パラメータ:
      sound=0       効果音を鳴らさない
      interval=20   登録者数の確認間隔 (秒、最小 15)
      hide=1        回っていないときは隠す
      scale=0.7     全体の拡大率 (文字は読みやすい大きさのまま、まるごと縮小・拡大する)
  -->
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body {
      font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Meiryo", sans-serif;
      color: #fff; display: flex; flex-direction: column; align-items: center;
    }
    .stage { position: relative; margin-top: 100px; zoom: var(--scale, 1); transition: opacity .5s, transform .5s; }
    body.idle-hidden .stage { opacity: 0; transform: translateY(20px) scale(.9); }

    /* ---------- 筐体 ---------- */
    .machine {
      position: relative; width: 620px; padding: 22px 26px 26px; box-sizing: border-box; border-radius: 30px;
      background: linear-gradient(180deg, #5a6cc4 0%, #3b4796 45%, #2a3370 100%);
      border: 5px solid #1b2440;
      box-shadow: inset 0 3px 0 #ffffff55, inset 0 -6px 0 #00000040, 0 14px 30px #0009;
    }
    .title {
      position: absolute; left: 50%; top: -26px; transform: translateX(-50%); white-space: nowrap;
      padding: 6px 26px; border-radius: 99px; font-size: 24px; font-weight: 900; letter-spacing: .08em;
      background: linear-gradient(180deg, #ffe98a, #f5b73b); color: #3a2a00; border: 4px solid #1b2440;
      box-shadow: 0 4px 0 #1b2440;
    }
    .lamps { display: flex; justify-content: space-between; padding: 0 6px; }
    .lamps.top { margin-bottom: 12px; }
    .lamps.bottom { margin-top: 12px; }
    .lamp { width: 14px; height: 14px; border-radius: 50%; background: #6b6f94; border: 2px solid #1b2440; transition: background .08s, box-shadow .08s; }
    .lamp.on { background: #fff6c2; box-shadow: 0 0 10px 3px #ffe066; }

    /* ---------- 窓とドラム ---------- */
    .window {
      position: relative; height: 290px; border-radius: 16px; overflow: hidden;
      border: 5px solid #1b2440; background: #0d1230;
      box-shadow: inset 0 0 0 3px #c9d8ff55;
    }
    .drumwrap { position: absolute; inset: 0; perspective: 1100px; filter: url(#vblur); }
    .drum { position: absolute; left: 0; right: 0; top: 50%; height: 0; transform-style: preserve-3d; }
    .face {
      position: absolute; left: 0; right: 0; display: flex; align-items: center; justify-content: center;
      box-sizing: border-box; padding: 0 70px; white-space: nowrap; font-weight: 900; color: #2a3360;
      backface-visibility: hidden; border-top: 2px solid #b9c6ec; border-bottom: 2px solid #b9c6ec;
      background: linear-gradient(180deg, #f2f6ff, #ffffff 50%, #e7eeff);
    }
    .face.win { animation: win .5s ease-in-out infinite alternate; }
    @keyframes win {
      from { background: linear-gradient(180deg, #fff3b8, #fffbe6 50%, #ffe680); color: #5a3a00; }
      to { background: linear-gradient(180deg, #ffe066, #fff6c2 50%, #ffd23f); color: #3a2400; }
    }
    /* 円柱っぽく上下を暗く + ガラスの反射 */
    .shade {
      position: absolute; inset: 0; pointer-events: none;
      background:
        linear-gradient(180deg, #0d1230 0%, #0d1230cc 10%, #0d123000 34%, #0d123000 66%, #0d1230cc 90%, #0d1230 100%),
        linear-gradient(180deg, #ffffff00 18%, #ffffff30 22%, #ffffff00 30%);
    }
    /* 当たりライン */
    .payline { position: absolute; left: 0; right: 0; top: 50%; height: 78px; transform: translateY(-50%); pointer-events: none; }
    .payline::before {
      content: ""; position: absolute; inset: 0; border-top: 3px solid #ff6b8b; border-bottom: 3px solid #ff6b8b;
      opacity: .85;
    }
    .arrow { position: absolute; top: 50%; width: 0; height: 0; border: 20px solid transparent; transform: translateY(-50%); filter: drop-shadow(0 2px 2px #0008); }
    .arrow.l { left: -4px; border-left: 30px solid #ff6b8b; border-right: 0; }
    .arrow.r { right: -4px; border-right: 30px solid #ff6b8b; border-left: 0; }
    .stage.won .arrow { animation: blink .25s steps(2) infinite; }
    @keyframes blink { 50% { opacity: .2; } }

    /* ---------- レバー ---------- */
    .lever { position: absolute; right: -54px; top: 120px; width: 40px; height: 170px; }
    .lever .base { position: absolute; left: 4px; bottom: 0; width: 32px; height: 56px; border-radius: 10px; background: #2a3370; border: 4px solid #1b2440; }
    .lever .arm { position: absolute; left: 14px; bottom: 30px; width: 12px; height: 130px; transform-origin: 50% 100%; }
    .lever .stick { position: absolute; inset: 22px 0 0; border-radius: 6px; background: linear-gradient(90deg, #c9d0e8, #ffffff, #9aa3c2); border: 3px solid #1b2440; }
    .lever .ball { position: absolute; left: 50%; top: 0; width: 38px; height: 38px; margin-left: -19px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffb3c4, #ff4f74 60%, #b8234a); border: 3px solid #1b2440; }
    .lever.pull .arm { animation: pull .7s cubic-bezier(.3, 0, .3, 1); }
    @keyframes pull { 0% { transform: scaleY(1); } 35% { transform: scaleY(-.55); } 100% { transform: scaleY(1); } }

    /* 説明文: 白い長方形 + 黒の太字 (登録者数の表示とそろえる) */
    .caption {
      display: table; margin: 16px auto 0; padding: 8px 20px; background: #fff; color: #111;
      font-size: 26px; font-weight: 900; letter-spacing: .02em; box-shadow: 0 4px 14px #0004;
    }
    /* 「登録者 +1 ありがとう！」 */
    #banner {
      position: absolute; left: 50%; top: -76px; white-space: nowrap; font-size: 32px; font-weight: 900;
      color: #ffe066; -webkit-text-stroke: 7px #1b2440; paint-order: stroke fill;
      transform: translate(-50%, 10px) scale(.4); opacity: 0; pointer-events: none;
    }
    #banner.show { animation: banner 1.8s cubic-bezier(.2, 1.6, .4, 1) forwards; }
    @keyframes banner {
      0% { opacity: 0; transform: translate(-50%, 10px) scale(.4); }
      22% { opacity: 1; transform: translate(-50%, 0) scale(1.08); }
      36% { transform: translate(-50%, 0) scale(1); }
      85% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -8px) scale(1); }
    }
    #confetti { position: fixed; inset: 0; pointer-events: none; }
    #error { position: fixed; left: 8px; bottom: 8px; font-size: 13px; color: #ffb3b3; background: #000a; padding: 4px 8px; border-radius: 6px; }
    #error:empty { display: none; }
  </style>
</head>
<body>
  <!-- 縦方向だけのモーションブラー (回転速度に合わせて強さを変える) -->
  <svg width="0" height="0" style="position:absolute">
    <filter id="vblur" x="0" y="-10%" width="100%" height="120%"><feGaussianBlur id="vblurAmt" stdDeviation="0 0" /></filter>
  </svg>
  <canvas id="confetti"></canvas>
  <div class="stage" id="stage">
    <div id="banner">登録者 +1 ありがとう！</div>
    <div class="machine">
      <div class="title">🎤 話題ルーレット</div>
      <div class="lamps top" id="lampsTop"></div>
      <div class="window">
        <div class="drumwrap"><div class="drum" id="drum"></div></div>
        <div class="shade"></div>
        <div class="payline"><span class="arrow l"></span><span class="arrow r"></span></div>
      </div>
      <div class="lamps bottom" id="lampsBottom"></div>
      <div class="lever" id="lever"><div class="base"></div><div class="arm"><div class="stick"></div><div class="ball"></div></div></div>
    </div>
    <div class="caption">登録者が1人増えるごとにルーレットが回ります</div>
  </div>
  <div id="error"></div>

  <script type="module">
    import { connect } from '/lib/ws.js';

    const q = new URLSearchParams(location.search);
    const SOUND = q.get('sound') !== '0';
    const HIDE_IDLE = q.get('hide') === '1';
    const INTERVAL = Math.max(15, Number(q.get('interval')) || 20) * 1000;
    document.documentElement.style.setProperty('--scale', Number(q.get('scale')) || 1);
    const $ = (id) => document.getElementById(id);
    const COLORS = ['#8fd3ff', '#c9a8ff', '#ffd6e7', '#b8f0e0', '#ffe8a8', '#a8c8ff', '#f5c2ff', '#ff8fa8'];
    const FACE_H = 76; // 1 コマの高さ (px)
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));

    // ---------- ランプ ----------
    const lamps = [];
    for (const id of ['lampsTop', 'lampsBottom']) {
      for (let i = 0; i < 16; i++) {
        const el = document.createElement('div');
        el.className = 'lamp';
        $(id).append(el);
        lamps.push(el);
      }
    }
    let lampMode = 'idle'; // idle | spin | win
    function updateLamps(now) {
      const step = Math.floor(now / (lampMode === 'spin' ? 70 : lampMode === 'win' ? 160 : 600));
      lamps.forEach((el, i) => {
        const k = i % 16;
        const on = lampMode === 'spin' ? (k + step) % 4 === 0 : lampMode === 'win' ? step % 2 === 0 : (k + step) % 2 === 0;
        el.classList.toggle('on', on);
      });
    }

    // ---------- ドラム (円柱) ----------
    // 話題が少なくても円柱に見えるよう、コマ数が 14 以上になるまで繰り返して並べる
    let topics = ['雑談'];
    let faces = []; // { el, topic }
    let N = 0;
    let step = 0; // 1 コマの角度 (度)
    let angle = 0; // ドラムの回転角 (度)。angle = i * step のとき i 番目のコマが正面
    let pendingTopics = null;

    function buildDrum(list) {
      const drum = $('drum');
      drum.textContent = '';
      const reps = Math.ceil(14 / list.length);
      N = list.length * reps;
      step = 360 / N;
      const radius = FACE_H / 2 / Math.tan(Math.PI / N);
      faces = [];
      for (let i = 0; i < N; i++) {
        const topic = list[i % list.length];
        const el = document.createElement('div');
        el.className = 'face';
        el.textContent = topic;
        el.style.height = `${FACE_H}px`;
        el.style.top = `${-FACE_H / 2}px`;
        el.style.fontSize = `${Math.max(22, Math.min(42, 440 / [...topic].length))}px`;
        el.style.transform = `rotateX(${-i * step}deg) translateZ(${radius}px)`;
        drum.append(el);
        faces.push({ el, topic });
      }
      angle = Math.floor(Math.random() * N) * step;
    }
    function setTopics(list) {
      const t = (list ?? []).map((s) => String(s).trim()).filter(Boolean);
      if (!t.length || t.join('\n') === topics.join('\n')) return;
      topics = t;
      if (busy) pendingTopics = t; // 回転中は終わってから入れ替える
      else buildDrum(t);
    }

    // ---------- 効果音 ----------
    let audio;
    function beep(freq, dur, type = 'triangle', vol = 0.15, at = 0) {
      if (!SOUND) return;
      try {
        audio ??= new AudioContext();
        const t = audio.currentTime + at;
        const o = audio.createOscillator();
        const g = audio.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, t);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g).connect(audio.destination);
        o.start(t);
        o.stop(t + dur);
      } catch {}
    }
    const leverSound = () => { beep(180, 0.12, 'square', 0.08); beep(120, 0.18, 'square', 0.08, 0.18); };
    const stopSound = () => beep(260, 0.15, 'square', 0.1);
    const fanfare = () => [523, 659, 784, 1047].forEach((f, i) => beep(f, i === 3 ? 0.7 : 0.16, 'square', 0.08, i * 0.12));

    // ---------- 紙吹雪 ----------
    const cf = $('confetti');
    const cctx = cf.getContext('2d');
    let pieces = [];
    function burst() {
      cf.width = innerWidth;
      cf.height = innerHeight;
      const r = $('stage').querySelector('.window').getBoundingClientRect();
      for (let i = 0; i < 160; i++) {
        const left = i % 2 === 0;
        const a = (left ? -Math.PI * 0.75 : -Math.PI * 0.25) + (Math.random() - 0.5) * 0.9;
        const v = 8 + Math.random() * 10;
        pieces.push({
          x: left ? r.left : r.right, y: r.top + r.height / 2, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
          w: 8 + Math.random() * 8, h: 5 + Math.random() * 6, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4,
          c: COLORS[i % COLORS.length], life: 1,
        });
      }
    }
    function drawConfetti() {
      cctx.clearRect(0, 0, cf.width, cf.height);
      for (const p of pieces) {
        p.vy += 0.32;
        p.vx *= 0.985;
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vr;
        p.life -= 0.005;
        cctx.save();
        cctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2));
        cctx.translate(p.x, p.y);
        cctx.rotate(p.rot);
        cctx.fillStyle = p.c;
        cctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.rot * 2)));
        cctx.restore();
      }
      pieces = pieces.filter((p) => p.life > 0 && p.y < cf.height + 40);
    }

    // ---------- 回転 ----------
    // 1) 一瞬上に引いてから 2) 一気に加速 3) ゆっくり減速して少し行き過ぎ 4) 当たりの位置へカクッと戻る
    let spin = null;
    let lastIdx = 0;
    let lastAngle = 0;
    const easeOut = (t) => 1 - (1 - t) ** 3;

    function startSpin() {
      const win = Math.floor(Math.random() * N);
      const cur = ((angle % 360) + 360) % 360;
      const target = angle + (((win * step - cur) % 360) + 360) % 360 + 360 * (5 + Math.floor(Math.random() * 2));
      return new Promise((resolve) => {
        spin = { t0: performance.now(), from: angle, target, over: step * 0.35, resolve: () => resolve(faces[win]) };
      });
    }

    function frame(now) {
      if (spin) {
        const t = (now - spin.t0) / 1000;
        const { from, target, over } = spin;
        if (t < 0.35) {
          angle = from - step * 0.4 * Math.sin((Math.PI * t) / 0.35); // 溜め
        } else if (t < 6.2) {
          angle = from + (target + over - from) * easeOut((t - 0.35) / 5.85);
        } else if (t < 6.7) {
          const k = (t - 6.2) / 0.5;
          angle = target + over * (1 - k) * Math.cos(k * Math.PI * 1.5) ** 2; // 行き過ぎから戻る
        } else {
          angle = target;
          const done = spin.resolve;
          spin = null;
          done();
        }
      }
      $('drum').style.transform = `rotateX(${angle}deg)`;
      // カチカチ (1 コマ進むごと)
      const idx = Math.round(angle / step);
      if (idx !== lastIdx && spin) beep(1500, 0.03, 'square', 0.04);
      lastIdx = idx;
      // 速さに応じた縦ブラー
      const speed = Math.abs(angle - lastAngle);
      lastAngle = angle;
      $('vblurAmt').setAttribute('stdDeviation', `0 ${Math.min(9, speed * 0.55).toFixed(2)}`);
      updateLamps(now);
      drawConfetti();
      requestAnimationFrame(frame);
    }

    // ---------- 順番待ち (複数人増えたらその回数ぶん) ----------
    let queued = 0;
    let busy = false;
    const setIdle = (idle) => document.body.classList.toggle('idle-hidden', HIDE_IDLE && idle);

    function requestSpin(n = 1) {
      queued += n;
      run();
    }
    async function run() {
      if (busy) return;
      busy = true;
      while (queued > 0) {
        queued--;
        setIdle(false);
        await wait(HIDE_IDLE ? 500 : 0);
        $('banner').classList.remove('show');
        void $('banner').offsetWidth;
        $('banner').classList.add('show');
        beep(880, 0.12, 'square', 0.07);
        beep(1320, 0.2, 'square', 0.07, 0.1);
        await wait(700);
        $('lever').classList.remove('pull');
        void $('lever').offsetWidth;
        $('lever').classList.add('pull');
        leverSound();
        await wait(250);
        lampMode = 'spin';
        const face = await startSpin();
        stopSound();
        await wait(250);
        lampMode = 'win';
        face.el.classList.add('win');
        $('stage').classList.add('won');
        fanfare();
        burst();
        await wait(6000);
        face.el.classList.remove('win');
        $('stage').classList.remove('won');
        lampMode = 'idle';
        await wait(500);
      }
      if (pendingTopics) {
        buildDrum(pendingTopics);
        pendingTopics = null;
      }
      setIdle(true);
      busy = false;
    }

    // ---------- 登録者数の監視 ----------
    let lastCount = null;
    async function poll() {
      try {
        const d = await (await fetch('/api/subscribers')).json();
        if (d.error) throw new Error(d.error);
        $('error').textContent = '';
        if (d.count == null) return;
        if (lastCount != null && d.count > lastCount) requestSpin(Math.min(d.count - lastCount, 10));
        lastCount = d.count;
      } catch (e) {
        $('error').textContent = `登録者数: ${e.message}`;
      }
    }

    // ---------- 起動 ----------
    setIdle(true);
    const cfg = await (await fetch('/api/config')).json();
    topics = [];
    setTopics(cfg.rouletteTopics);
    if (!faces.length) buildDrum(topics.length ? topics : ['雑談']);
    lastAngle = angle;
    lastIdx = Math.round(angle / step);
    requestAnimationFrame(frame);
    poll();
    setInterval(poll, INTERVAL);
    // 話題の更新・テスト回転はコントロール画面から
    connect('roulette', (msg) => {
      if (msg.type === 'config') setTopics(msg.config.rouletteTopics);
      else if (msg.type === 'roulette-spin') requestSpin(1);
    });
  </script>
</body>
</html>
